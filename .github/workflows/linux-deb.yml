name: Build Linux .deb

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install fpm --no-document

      - name: Build .deb
        run: npm run dist:linux

      - name: Show artifact
        run: ls -lh release/*.deb

      - name: Upload .deb to the matching release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" release/*.deb --repo "$GITHUB_REPOSITORY" --clobber
